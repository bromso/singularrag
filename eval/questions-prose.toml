# Fixed on first run. Never edit an existing question; add new ids instead.
# Authored against the prose fixture (`singularrag_core::fixture::write_prose`: the files in
# crates/singularrag-core/fixtures/prose/ written under docs/). Every gold entry is
# `path::name` where `name` is a heading's text (a `section`).
# `paraphrase` questions share no distinctive word with their gold section, so only a
# semantic hit finds them; `entity` and `relation` questions name entities from
# fixtures/prose/extraction.json.

