# The harness's own walk file: the prose fixture (`fixture::write_prose`) plus the code and docs
# mini fixture (`fixture::write_docs_mini`), plus the schema fixture (`fixture::write_schema_mini`),
# the checked-in prose extraction loaded with --extraction, no model. Two for locate, two for
# process, three for connection (an entity start, a symbol start, and a schema start), two for
# change: nine walks.
budget = 4096

[[walk]]
id = "C1"
kind = "locate"
query = "how do I get reimbursed after paying for something myself on the job"
gold = ["docs/handbook.md::Expense process"]

[[walk]]
id = "C2"
kind = "process"
query = "what happens after my manager approves an expense claim"
role = "Finance"
step_text = "within 5 days"
gold = ["docs/handbook.md::Expense process"]

[[walk]]
id = "C3"
kind = "connection"
from = "Okta"
gold = ["docs/handbook.md::Onboarding"]

[[walk]]
id = "C4"
kind = "connection"
from = "src/auth/session.ts::createSession"
hops = 1
gold = ["src/http/middleware.ts::requireSession"]

[[walk]]
id = "C5"
kind = "change"
patch = "patches/ci-session.patch"
gold = ["src/auth/session.ts::createSession"]

# The schema fixture (`fixture::write_schema_mini`): tables and columns as symbols (schema spec §5).

[[walk]]
id = "C6"
kind = "locate"
query = "which table holds each event a website records"
gold = ["prisma/schema.prisma::website_event", "prisma/migrations/01_init/migration.sql::website_event"]

[[walk]]
id = "C7"
kind = "process"
query = "what happens when a visitor opens a page"
step_text = "writes one row"
implemented_by = "prisma/schema.prisma::website_event"
gold = ["docs/data-model.md::Recording a visit"]

[[walk]]
id = "C8"
kind = "connection"
from = "prisma/schema.prisma::website"
hops = 1
gold = ["src/queries/website.ts::getWebsite"]

[[walk]]
id = "C9"
kind = "change"
patch = "patches/ci-schema.patch"
gold = ["prisma/schema.prisma::website"]
