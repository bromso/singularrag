[workspace]
members = ["crates/singularrag-core", "crates/singularrag", "crates/singularrag-bench"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "=0.1.6"
tree-sitter = "0.27"
tree-sitter-tags = "0.27"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-md = "0.5"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
ignore = "0.4"
globset = "0.4"
blake3 = "1.8"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
toml_edit = { version = "0.25", features = ["serde"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time", "net"] }
rmcp = { version = "3.4", features = ["server", "transport-io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["set-header"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
notify = "8"
notify-debouncer-full = "0.7"
open = "5"
rand = "0.10"
hex = "0.4"
subtle = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "blocking"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = "thin"
strip = true
